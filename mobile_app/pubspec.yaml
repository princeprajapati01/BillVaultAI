name: billvault_mobile
description: "BillVaultAI (Aura Billing Suite) Cross-Platform Mobile Application for Android & iOS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  glassmorphism: ^3.0.0
  fl_chart: ^0.68.0

  # Networking & Async
  http: ^1.2.0
  http_parser: ^4.0.2
  async: ^2.11.0

  # State Management & Local Storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Media & Files
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  path: ^1.9.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
